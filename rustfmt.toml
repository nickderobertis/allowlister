# Stable rustfmt options only. Nightly-only options (import grouping, comment
# wrapping) are intentionally omitted so `cargo fmt` is deterministic on the
# pinned stable toolchain.
edition = "2021"
max_width = 100
newline_style = "Unix"
use_small_heuristics = "Default"
use_field_init_shorthand = true
use_try_shorthand = true
