name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI only needs to read the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Authenticate cargo-binstall's GitHub API calls in `just bootstrap` so it is
  # not rate-limited — an unauthenticated 403 silently triggers a source-build
  # fallback that then collides with the already-installed tool on macOS.
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  # The gate. A clean checkout runs `just bootstrap` then `just check` — the same
  # full quality gate developers run locally (format, type-check, lint, the full
  # test suite incl. binary e2e, enforced coverage, deps/security, docs, release
  # build). Matrix over the platforms the binary ships to. The context names
  # (`test (ubuntu-latest)`, ...) are the protected required checks — keep stable.
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          # Don't cache ~/.cargo/bin: a stale cached tool binary collides with
          # bootstrap's reinstall ("already exists in destination"). Reinstalling
          # the prebuilt each run is cheap and deterministic.
          cache-bin: false
      # Prebuilt binaries for the cargo subcommands the gate needs; `bootstrap`
      # below is idempotent and no-ops over anything already present.
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-nextest,cargo-llvm-cov,cargo-deny,cargo-machete
      - name: Bootstrap
        run: just bootstrap
      - name: Gate (just check)
        run: just check

  # Dedicated coverage job: a standalone required context and a fast path to the
  # report on Linux. The same 95% floor is also enforced inside `just check`.
  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-nextest,cargo-llvm-cov
      - run: just test-cov

  # Supply chain: run once on Linux (not duplicated across the OS matrix).
  deps:
    name: deps & security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-deny,cargo-machete
      - run: just deps-check
      - run: just security
