name: CI

# Every gate job runs a `just` recipe at the tier .github/scripts/gate-tier.mjs
# chooses for the event — the same recipes developers run, so local and CI cannot
# drift (AGENTS.md "Commits, releases, and merging" records the placement):
#
#   * release-plz's release PR (head branch `release-plz-*`) runs the BROADER
#     tier, `just <recipe> all`: one full sweep over every gate-eligible project.
#     Releases are batched behind that PR, so it is the one lifecycle point the
#     shipped commit is swept; a red sweep turns these same contexts red and
#     auto-merge cannot cut a release past it.
#   * every other pull request, and every push to main, runs the AFFECTED tier
#     against an explicitly derived base (the merge base with the PR's base
#     branch; the previous tip on a push).
#
# Fixed status-check contexts (branch protection names them): `test
# (ubuntu-latest)`, `test (macos-latest)`, `test (windows-latest)`, `coverage`,
# `deps & security`. Keep these job names and matrix values. None of these jobs
# carries an `if`, a `needs`, or a path filter, so each reports on every pull
# request — including one whose targets are all unaffected, where Nx runs nothing
# and the job passes. .github/tests/workflow-contract.test.mjs enforces this.

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI only needs to read the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Authenticate cargo-binstall's GitHub API calls in `just bootstrap` so it is
  # not rate-limited — an unauthenticated 403 silently triggers a source-build
  # fallback that then collides with the already-installed tool on macOS.
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  # The gate. A clean checkout runs `just bootstrap` then `just check` at the
  # routed tier: format, type-check, lint, every test target (unit + integration,
  # binary e2e, schema validation, workflow contracts), enforced coverage,
  # docs, the release build + plan, and the supply chain. Matrix over the
  # platforms the binary ships to.
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      # Full history: the affected tier resolves its base from it.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Node runs Nx; the version is the .tool-versions pin.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .tool-versions
      # uv runs the schema validator (config-schema:test).
      - uses: astral-sh/setup-uv@v6
      - name: Install pinned toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          # Don't cache ~/.cargo/bin: a stale cached tool binary collides with
          # bootstrap's reinstall ("already exists in destination"). Reinstalling
          # the prebuilt each run is cheap and deterministic.
          cache-bin: false
      # Prebuilt binaries for the cargo subcommands the gate needs; `bootstrap`
      # below is idempotent and no-ops over anything already present.
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-nextest,cargo-llvm-cov,cargo-deny,cargo-machete
      - name: Bootstrap
        run: just bootstrap
      - name: Choose the gate tier
        id: tier
        run: node .github/scripts/gate-tier.mjs
      - name: Gate (just check)
        env:
          TIER: ${{ steps.tier.outputs.tier }}
          NX_BASE: ${{ steps.tier.outputs.base }}
        run: just check "$TIER"

  # Dedicated coverage job: a standalone required context and a fast path to the
  # report on Linux. The same 95% floor is also enforced inside `just check`.
  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .tool-versions
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-nextest,cargo-llvm-cov
      - name: Choose the gate tier
        id: tier
        run: node .github/scripts/gate-tier.mjs
      - name: Coverage (just test-cov)
        env:
          TIER: ${{ steps.tier.outputs.tier }}
          NX_BASE: ${{ steps.tier.outputs.base }}
        # llmlint: ignore[no_second_broader_sweep_over_an_already_gated_commit] `coverage` is one of the fixed required contexts branch protection names, so it must report on every pull request on its own; folding it into `test (<os>)` (or making it reuse that job) changes the required-check contract, which is a governance decision outside this workflow.
        run: just test-cov "$TIER"

  # Supply chain: run once on Linux (not duplicated across the OS matrix).
  deps:
    name: deps & security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .tool-versions
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-deny,cargo-machete
      - name: Choose the gate tier
        id: tier
        run: node .github/scripts/gate-tier.mjs
      - name: Supply chain (just supply-chain)
        env:
          TIER: ${{ steps.tier.outputs.tier }}
          NX_BASE: ${{ steps.tier.outputs.base }}
        run: just supply-chain "$TIER"

  llmlint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: extractions/setup-just@v3
      - uses: astral-sh/setup-uv@v6
      - name: Install llmlint toolchain
        run: ./scripts/setup-llmlint.sh
      # oneharness drives the real `codex` CLI (its primary harness, per
      # oneharness.toml), so the binary must be on PATH AND authenticated — else
      # its fallback chain finds no runnable harness and the judge errors. The
      # codex CLI does not read OPENAI_API_KEY from the env; it needs an explicit
      # `codex login --with-api-key`, the same mechanism scripts/e2e-codex.sh uses.
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install and authenticate the Codex CLI (oneharness primary harness)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          npm install -g @openai/codex
          codex --version
          if [ -z "${OPENAI_API_KEY:-}" ]; then
            echo "::error::OPENAI_API_KEY is required to authenticate the codex CLI for llmlint" >&2
            exit 1
          fi
          printf '%s' "$OPENAI_API_KEY" | codex login --with-api-key
      - name: Validate llmlint config
        run: just lint-llm-validate --diff-base origin/main
      - name: Lint changed files
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "${OPENAI_API_KEY:-}" ]; then
            echo "::error::llmlint needs OPENAI_API_KEY for the Codex harness" >&2
            exit 1
          fi
          just lint-llm-diff origin/main
