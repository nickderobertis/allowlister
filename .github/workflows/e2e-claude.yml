name: E2E (Claude Code)

# Live end-to-end check that drives the real `claude` CLI against allowlister
# wired as a Bash PreToolUse hook (scripts/e2e-claude.sh). Unlike ci.yml this
# needs network, a model call, and the CLAUDE_CODE_OAUTH_TOKEN secret, so it
# lives in its own workflow gated to trusted contexts only.
#
# Security: a secret in a public repo must never be reachable by untrusted code.
# GitHub already withholds secrets from fork pull requests; the job `if` below is
# defense in depth — it runs only in the canonical repo and never for a PR whose
# head is a fork, so this workflow can be edited in a fork PR without exposing
# the token.

on:
  pull_request:
  workflow_dispatch:
    inputs:
      os:
        description: "Platform(s): 'default' = this workflow's PR matrix, 'all' = every supported OS, or a single OS. Check one harness/platform without a full rerun."
        type: choice
        default: default
        options:
          - default
          - all
          - ubuntu-latest
          - macos-latest
          - windows-latest

permissions:
  contents: read

concurrency:
  group: e2e-claude-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  live:
    name: claude live e2e (${{ matrix.os }})
    if: >-
      github.repository == 'nickderobertis/allowlister' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    strategy:
      fail-fast: false
      # PR runs the full cross-platform matrix (claude is a primary harness);
      # workflow_dispatch overrides via the `os` input ('all', or a single OS)
      # so one platform can be rechecked without a full rerun. See AGENTS.md >
      # "Live e2e in CI".
      matrix:
        os: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.os != 'default' && (inputs.os == 'all' && '["ubuntu-latest","macos-latest","windows-latest"]' || format('["{0}"]', inputs.os)) || '["ubuntu-latest","macos-latest","windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    # Bash on every platform: the live checks are bash scripts (scripts/e2e-*.sh),
    # so Windows runs them through Git Bash rather than the default PowerShell.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Verify the auth token is present
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "${CLAUDE_CODE_OAUTH_TOKEN:-}" ]; then
            echo "::error::CLAUDE_CODE_OAUTH_TOKEN secret is not set. Mint one locally with 'claude setup-token' and add it: gh secret set CLAUDE_CODE_OAUTH_TOKEN --repo ${{ github.repository }}"
            exit 1
          fi

      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just

      # The live check drives the harness through oneharness; without it the
      # script skips (a missing oneharness is a skip, like a missing harness).
      - name: Install oneharness (drives the live check)
        run: |
          cargo install --git https://github.com/nickderobertis/oneharness --tag v0.2.44 --locked
          oneharness --version

      - name: Install Claude Code CLI
        run: |
          npm install -g @anthropic-ai/claude-code
          claude --version

      - name: Live hook e2e against the real CLI
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: just test-claude
