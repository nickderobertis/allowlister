name: E2E (Goose)

# Live end-to-end check that drives the real Goose CLI against allowlister wired
# as a PreToolUse hook plugin (scripts/e2e-goose.sh). Unlike ci.yml this needs
# network, a model call, and an LLM provider key (OPENAI_API_KEY), so it lives in
# its own workflow gated to trusted contexts only.
#
# Security: a secret in a public repo must never be reachable by untrusted code.
# GitHub already withholds secrets from fork pull requests; the job `if` below is
# defense in depth — it runs only in the canonical repo and never for a PR whose
# head is a fork, so this workflow can be edited in a fork PR without exposing
# the key.

on:
  pull_request:
  workflow_dispatch:
    inputs:
      os:
        description: "Platform(s): 'default' = this workflow's PR matrix, 'all' = every supported OS, or a single OS. Check one harness/platform without a full rerun."
        type: choice
        default: default
        options:
          - default
          - all
          - ubuntu-latest
          - macos-latest
          - windows-latest

permissions:
  contents: read

concurrency:
  group: e2e-goose-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  live:
    name: goose live e2e (${{ matrix.os }})
    # llmlint: ignore-file[live_tier_compiles_and_requires_credential] fork PRs get a read-only token with no secrets, so the live tier must skip (not fail) there; this same-repo guard is intentional and documented in .github/AGENTS.md.
    if: >-
      github.repository == 'nickderobertis/allowlister' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    strategy:
      fail-fast: false
      # Linux-only on PR to keep paid live runs down; workflow_dispatch widens
      # to 'all' (every supported OS) or a single OS on demand. See AGENTS.md >
      # "Live e2e in CI".
      matrix:
        os: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.os != 'default' && (inputs.os == 'all' && '["ubuntu-latest","macos-latest","windows-latest"]' || format('["{0}"]', inputs.os)) || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    # Bash on every platform: the live checks are bash scripts (scripts/e2e-*.sh),
    # so Windows runs them through Git Bash rather than the default PowerShell.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Verify the provider key is present
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "${OPENAI_API_KEY:-}" ]; then
            echo "::error::OPENAI_API_KEY secret is not set. Add a provider key (and set the GOOSE_E2E_MODEL repo variable) and set it: gh secret set OPENAI_API_KEY --repo ${{ github.repository }}"
            exit 1
          fi

      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just

      # The live check drives the harness through oneharness; without it the
      # script skips (a missing oneharness is a skip, like a missing harness).
      - name: Install oneharness (drives the live check)
        run: |
          cargo install --git https://github.com/nickderobertis/oneharness --tag v0.2.44 --locked
          oneharness --version

      - name: Install Goose CLI
        # download_cli.sh self-detects the OS (linux/darwin/windows); on Windows it
        # runs under Git Bash and drops goose.exe under ~/.local/bin, so the one
        # installer works on every platform.
        run: |
          curl -fsSL https://github.com/block/goose/releases/download/stable/download_cli.sh | CONFIGURE=false bash
          # The installer drops goose under ~/.local/bin on Unix but ~/goose on
          # Windows; add both so the binary is found regardless of platform.
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/goose" >> "$GITHUB_PATH"

      - name: Live hook e2e against the real CLI
        env:
          GOOSE_PROVIDER: openai
          GOOSE_MODEL: ${{ vars.GOOSE_E2E_MODEL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          goose --version
          just test-goose
