name: Release

# Build and attach the cross-platform binaries for a published release.
#
# The GitHub Release itself is created by release-plz (see release-plz.yml) when
# a version-bump PR merges. Because release-plz uses a PAT, that release fires
# the `release: published` event below; this workflow then gates on a passing
# test run and uploads the archives + checksums to the release. Creating a
# release by hand in the GitHub UI is a supported manual fallback — it triggers
# the same event.

on:
  release:
    types: [published]

# Least privilege: only the upload jobs need write access to attach assets.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # Gate the release on a passing test run so untested artifacts never publish.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-nextest
      - run: just clippy
      - run: just test
      - run: just test-e2e

  upload:
    name: upload (${{ matrix.target }})
    needs: test
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native runners per target so no target needs cross-compilation:
          # arm64 Linux builds on a hosted arm64 runner; macOS cross-builds
          # x86_64<->arm64 within the Apple toolchain (no emulation/Docker).
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Build, archive, checksum, and upload
        uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: allowlister
          target: ${{ matrix.target }}
          archive: $bin-$tag-$target
          checksum: sha256
          include: README.md,LICENSE,CHANGELOG.md
          token: ${{ secrets.GITHUB_TOKEN }}

  # crates.io publishing is opt-in: set the repository variable
  # PUBLISH_TO_CRATES_IO=true and provide the CARGO_REGISTRY_TOKEN secret.
  publish-crate:
    needs: [upload]
    if: ${{ vars.PUBLISH_TO_CRATES_IO == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
