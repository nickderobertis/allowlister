name: Release

# Build and attach the cross-platform binaries for a published release.
#
# The GitHub Release itself is created by release-plz (see release-plz.yml) when
# a version-bump PR merges. Because release-plz uses a PAT, that release fires
# the `release: published` event below; this workflow then gates on a passing
# test run and uploads the archives + checksums to the release. Creating a
# release by hand in the GitHub UI is a supported manual fallback — it triggers
# the same event.

on:
  release:
    types: [published]

# Least privilege: only the upload jobs need write access to attach assets.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # Gate the release on the full gate so untested artifacts never publish. Kept
  # for the manual-release fallback (a release cut by hand skips the release-PR
  # sweep): `just check all` runs every gate target over every project — clippy,
  # the unit + integration tests and the binary e2e suite among them.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Node runs Nx at the .tool-versions pin (read as in ci.yml).
      - name: Read the pinned Node version
        id: node
        shell: bash
        run: |
          v="$(awk '$1 == "nodejs" { print $2 }' .tool-versions)"
          [ -n "$v" ] || { echo "::error::.tool-versions pins no nodejs version" >&2; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.node.outputs.version }}
      - uses: astral-sh/setup-uv@v6
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      # The cargo subcommands the gate's targets run (ci.yml's coverage and deps
      # jobs install the same).
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-nextest,cargo-llvm-cov,cargo-deny,cargo-machete
      # llmlint: ignore-block[no_second_broader_sweep_over_an_already_gated_commit, release_does_not_regate_an_already_swept_commit] a recorded standing decision (this file's header, .github/AGENTS.md): a release cut by hand never had a release-PR sweep, and the release event cannot tell the two kinds apart, so the release always re-runs the gate before any binary uploads.
      - name: Gate (just check all)
        run: just check all
      # llmlint: ignore-end[no_second_broader_sweep_over_an_already_gated_commit, release_does_not_regate_an_already_swept_commit]

  build:
    name: build (${{ matrix.target }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add "${{ matrix.target }}"
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: Build and package
        env:
          TAG: ${{ github.event.release.tag_name }}
          TARGET: ${{ matrix.target }}
        run: just dist-build "$TARGET" "$TAG"
      - name: Install and run staged artifact
        env:
          TAG: ${{ github.event.release.tag_name }}
          TARGET: ${{ matrix.target }}
        run: bash scripts/verify-release.sh "$TARGET" "$TAG"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  darwin:
    name: build (Darwin archives)
    needs: test
    # Standard macos-15 is Apple Silicon. Intel macOS is not released, so the one
    # Mac job builds, installs and runs only the native arm64 archive.
    runs-on: macos-15
    defaults:
      run:
        shell: bash
    env:
      TARGET: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add "$TARGET"
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: Build and package
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: just dist-build "$TARGET" "$TAG"
      - name: Install and run staged artifact
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: bash scripts/verify-release.sh "$TARGET" "$TAG"
      - uses: actions/upload-artifact@v4
        with:
          name: release-darwin
          path: dist/*
          if-no-files-found: error

  upload:
    name: upload release assets
    needs: [build, darwin]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Attach exact-run assets to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY"

  # crates.io publishing is opt-in: set the repository variable
  # PUBLISH_TO_CRATES_IO=true and provide the CARGO_REGISTRY_TOKEN secret.
  publish-crate:
    needs: [upload]
    if: ${{ vars.PUBLISH_TO_CRATES_IO == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
