name: Release

on:
  push:
    tags: ["v*"]

# Least privilege: only the binary-upload jobs need write access to create the
# GitHub Release and attach assets.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # Gate the release on a passing test run so untested artifacts never publish.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-nextest
      - run: just clippy
      - run: just test
      - run: just test-e2e

  # Create the GitHub Release once, before the parallel upload matrix, so the
  # matrix jobs never race to create it.
  create-release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create release for the tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" \
              --verify-tag \
              --notes "Prebuilt binaries and checksums are attached below. See CHANGELOG.md for release notes."
          fi

  upload:
    name: upload (${{ matrix.target }})
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native runners per target so no target needs cross-compilation:
          # arm64 Linux builds on a hosted arm64 runner; macOS cross-builds
          # x86_64<->arm64 within the Apple toolchain (no emulation/Docker).
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Build, archive, checksum, and upload
        uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: allowlister
          target: ${{ matrix.target }}
          archive: $bin-$tag-$target
          checksum: sha256
          include: README.md,LICENSE,CHANGELOG.md
          token: ${{ secrets.GITHUB_TOKEN }}

  # crates.io publishing is opt-in: set the repository variable
  # PUBLISH_TO_CRATES_IO=true and provide the CARGO_REGISTRY_TOKEN secret.
  publish-crate:
    needs: [create-release, upload]
    if: ${{ vars.PUBLISH_TO_CRATES_IO == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
