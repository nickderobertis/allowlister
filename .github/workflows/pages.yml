name: Publish JSON schema

# Keeps the `gh-pages` branch in sync with `schema/`, so GitHub Pages (configured
# as "Deploy from a branch: gh-pages / root") serves the config JSON Schema at its
# canonical $id:
#   https://nickderobertis.github.io/allowlister/allowlister.schema.json
# Informational and outside the gate: it never blocks a PR. The branch holds only
# the published artifact (schema files at its root), rebuilt fresh each run.

on:
  push:
    branches: [main]
    paths:
      - "schema/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# Least privilege: read the source, write the published branch.
permissions:
  contents: write

# One publish at a time; let a running one finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish schema/ to gh-pages
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          staging="$(mktemp -d)"
          cp -R schema/. "$staging/"
          # Serve files verbatim (no Jekyll), including any leading-underscore names.
          touch "$staging/.nojekyll"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Rebuild gh-pages as a single-commit branch of just the published files.
          git switch --orphan gh-pages
          git rm -rf --quiet . 2>/dev/null || true
          cp -R "$staging/." .
          git add -A
          git commit --quiet -m "Publish config JSON Schema from ${GITHUB_SHA}"
          git push --force origin gh-pages
