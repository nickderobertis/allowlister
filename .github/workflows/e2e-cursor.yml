name: E2E (Cursor)

# Live end-to-end check that drives the real `cursor-agent` CLI against
# allowlister wired as a beforeShellExecution hook (scripts/e2e-cursor.sh).
# Unlike ci.yml this needs network, a model call, and the CURSOR_API_KEY secret,
# so it lives in its own workflow gated to trusted contexts only.
#
# Security: a secret in a public repo must never be reachable by untrusted code.
# GitHub already withholds secrets from fork pull requests; the job `if` below is
# defense in depth — it runs only in the canonical repo and never for a PR whose
# head is a fork, so this workflow can be edited in a fork PR without exposing
# the key.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-cursor-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  live:
    name: cursor live e2e (${{ matrix.os }})
    if: >-
      github.repository == 'nickderobertis/allowlister' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    # Bash on every platform: the live checks are bash scripts (scripts/e2e-*.sh),
    # so Windows runs them through Git Bash rather than the default PowerShell.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Verify the API key is present
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: |
          if [ -z "${CURSOR_API_KEY:-}" ]; then
            echo "::error::CURSOR_API_KEY secret is not set. Generate a user key at https://cursor.com/dashboard/api and add it: gh secret set CURSOR_API_KEY --repo ${{ github.repository }}"
            exit 1
          fi

      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just

      # The live check drives the harness through oneharness; without it the
      # script skips (a missing oneharness is a skip, like a missing harness).
      - name: Install oneharness (drives the live check)
        run: |
          cargo install --git https://github.com/nickderobertis/oneharness --tag v0.1.1 --locked
          oneharness --version

      - name: Install Cursor CLI
        run: |
          case "$RUNNER_OS" in
            Linux | macOS)
              curl https://cursor.com/install -fsS | bash
              ;;
            Windows)
              # cursor-agent has no Unix curl|bash installer for Windows; use the
              # documented PowerShell installer. Native Windows support is limited,
              # so this path is best-effort and iterated on in CI.
              powershell -NoProfile -Command "irm 'https://cursor.com/install?win32=true' | iex"
              ;;
          esac
          # The binary is `cursor-agent` on Unix but `agent`/`agent.exe` via the
          # win32 installer, and lands in different dirs. Locate it, add its dir to
          # PATH, and pin CURSOR_AGENT_BIN so the test invokes it by exact path.
          echo "post-install agent candidates:"
          find "$HOME" -type f \( -iname 'cursor-agent*' -o -iname 'agent.exe' \) 2>/dev/null | sed 's/^/  /' | head -20 || true
          bin="$(command -v cursor-agent 2>/dev/null || true)"
          [ -z "$bin" ] && bin="$(find "$HOME" -type f \( -iname 'cursor-agent' -o -iname 'cursor-agent.exe' \) 2>/dev/null | head -1)"
          [ -z "$bin" ] && bin="$(find "$HOME" -type f -iname 'agent.exe' 2>/dev/null | grep -iE 'cursor|/\.local/' | head -1)"
          [ -z "$bin" ] && bin="$(find "$HOME" -type f -iname 'agent.exe' 2>/dev/null | head -1)"
          if [ -n "$bin" ]; then
            echo "$(dirname "$bin")" >> "$GITHUB_PATH"
            echo "CURSOR_AGENT_BIN=$bin" >> "$GITHUB_ENV"
            echo "resolved cursor agent binary: $bin"
          else
            echo "::warning::cursor agent binary not found after install"
          fi

      # Fails the job (rather than letting the script skip) if the install did not
      # produce an agent binary — a missing CLI must not read as a silent pass.
      - name: Show cursor-agent version
        run: '"${CURSOR_AGENT_BIN:-cursor-agent}" --version'

      - name: Live hook e2e against the real CLI
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: just test-cursor
