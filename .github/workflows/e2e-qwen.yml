name: E2E (Qwen Code)

# Live end-to-end check that drives the real Qwen Code CLI against allowlister
# wired as a PreToolUse hook (scripts/e2e-qwen.sh). Unlike ci.yml this needs
# network, a model call, and an OpenAI-compatible provider key (OPENAI_API_KEY),
# so it lives in its own workflow gated to trusted contexts only.
#
# Security: a secret in a public repo must never be reachable by untrusted code.
# GitHub already withholds secrets from fork pull requests; the job `if` below is
# defense in depth — it runs only in the canonical repo and never for a PR whose
# head is a fork, so this workflow can be edited in a fork PR without exposing
# the key.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-qwen-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  live:
    name: qwen live e2e (${{ matrix.os }})
    if: >-
      github.repository == 'nickderobertis/allowlister' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    # Bash on every platform: the live checks are bash scripts (scripts/e2e-*.sh),
    # so Windows runs them through Git Bash rather than the default PowerShell.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Verify the provider key is present
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "${OPENAI_API_KEY:-}" ]; then
            echo "::error::OPENAI_API_KEY secret is not set. Add an OpenAI-compatible key (with OPENAI_BASE_URL / OPENAI_MODEL as needed for Qwen) and set it: gh secret set OPENAI_API_KEY --repo ${{ github.repository }}"
            exit 1
          fi

      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just

      # The live check drives the harness through oneharness; without it the
      # script skips (a missing oneharness is a skip, like a missing harness).
      - name: Install oneharness (drives the live check)
        run: |
          cargo install --git https://github.com/nickderobertis/oneharness --tag v0.1.1 --locked
          oneharness --version

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Qwen Code CLI
        run: |
          npm install -g @qwen-code/qwen-code
          qwen --version

      - name: Live hook e2e against the real CLI
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          OPENAI_MODEL: ${{ vars.QWEN_E2E_MODEL }}
        run: just test-qwen
