# The `allowlister` crate (lib + bin), and the root of the Cargo workspace: one
# Cargo.lock for every member. It stays the root package with a literal `version`
# because release-plz bumps and tags exactly this manifest; the other members are
# test-only and never released (release-plz.toml).
[package]
name = "allowlister"
version = "0.5.10"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Structural allow/deny/defer engine for AI coding-agent shell commands. Parses the bash AST, decomposes it into role-tagged fragments, and gates each fragment with glob/regex/argv rules."
repository.workspace = true
homepage = "https://github.com/nickderobertis/allowlister"
documentation = "https://docs.rs/allowlister"
readme = "README.md"
keywords = ["cli", "security", "claude-code", "permissions", "shell"]
categories = ["command-line-utilities", "development-tools"]
# Package only what a crates.io consumer needs: the sources, manifest, readme,
# and license. This keeps the published crate small and avoids packaging the
# CLAUDE.md symlinks, CI config, tests, and the rest of `examples/`. The two
# recommended profiles are the exception: `install` embeds them with
# `include_str!`, so they must be in the package for the crate to build.
include = [
    "src/**/*.rs",
    "Cargo.toml",
    "README.md",
    "LICENSE",
    "examples/recommended/*.jsonc",
]
# Integration tests are listed explicitly below: tests/e2e/ is a workspace member
# of its own (the binary-driving suite), which Cargo's auto-discovery of
# `tests/*/main.rs` would otherwise also claim as a target of this crate.
autotests = false

[[bin]]
name = "allowlister"
path = "src/main.rs"

[lib]
name = "allowlister"
path = "src/lib.rs"

[dependencies]
brush-parser = "0.4.0"
clap = { version = "4.5", features = ["derive"] }
fancy-regex = "0.18.0"
# Cross-harness hook installer. allowlister supplies the per-harness `HookSpec`
# (command, matcher, timeout) and oneharness-core renders and writes it in each
# harness's native shape, so the eight install/merge/path implementations live in
# one place instead of being duplicated here. Pinned by git tag; not on crates.io
# yet, so a future crates.io publish of allowlister would need it released there.
oneharness-core = { git = "https://github.com/nickderobertis/oneharness", tag = "v0.2.528", version = "0.2" }
regex = "1.12"
serde = { version = "1.0", features = ["derive"] }
serde_json.workspace = true
# `VariantArray` gives each config-vocabulary enum a compiler-generated
# `VARIANTS` list, so the JSON Schema drift test compares against every variant
# the engine actually has — adding a role/param/action/kind/grant fails that test
# until the schema is updated too. Derive-only; no runtime weight.
strum = { version = "0.27", features = ["derive"] }
thiserror = "2.0"

[dev-dependencies]
# Drives the schema-drift test: read each config enum's compiler-generated
# `VARIANTS` and assert the published JSON Schema lists exactly those values.
strum = { version = "0.27", features = ["derive"] }
tempfile.workspace = true
# Statistical micro-benchmarks of the pure engine (see `benches/`). Default
# features (plotters HTML reports, rayon) are dropped to keep the dependency
# tree — and the `cargo deny` surface — small; `cargo_bench_support` is the only
# feature `cargo bench` needs, and it still emits the per-bench `estimates.json`
# that `critcmp` diffs.
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

# A CLI binary that spawns once per agent tool call: optimize for a small,
# fast-to-start artifact. `thin` LTO and a single codegen unit shrink the
# binary and improve runtime without the long link times of fat LTO; symbol
# stripping removes debug info that release users never consume.
[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

# Profiling builds: the shipped release artifact exactly, but with symbols kept
# so `samply` (see `scripts/profile.sh`) can attribute time to functions. This
# never affects the published binary — `just profile` builds `--profile
# profiling` into `target/profiling/` while `[profile.release]` stays stripped.
[profile.profiling]
inherits = "release"
debug = true
strip = false

[[test]]
name = "golden"
path = "tests/golden.rs"

[[test]]
name = "recommended"
path = "tests/recommended.rs"

[[test]]
name = "schema"
path = "tests/schema.rs"

# Statistical micro-benchmarks of the engine hot paths. `harness = false` hands
# `main` to Criterion instead of libtest, so `cargo nextest`/coverage never pick
# this target up — it is measured, not gated.
[[bench]]
name = "engine"
harness = false

# Deterministic allocation tallies for the same hot paths: a plain `main` with a
# counting global allocator, no Criterion. Exact counts compare across runs and
# commits without statistics; informational like every bench target.
[[bench]]
name = "engine_allocs"
harness = false

# Cargo resolves every member against the one Cargo.lock above; Nx runs each
# member's targets (project.json beside each manifest). Members are test-only
# crates: `tests/e2e` drives the compiled binary from its own crate so a library
# change that cannot reach it never rebuilds and respawns the binary.
[workspace]
members = ["tests/e2e"]
resolver = "2"

# Shared metadata every member inherits. `version` is deliberately not here: the
# released crate keeps its own literal version (see the top of this file).
[workspace.package]
edition = "2021"
# The MSRV `just msrv` checks; clippy.toml's `msrv` restates it.
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/nickderobertis/allowlister"

# Dependencies more than one member declares, versioned once.
[workspace.dependencies]
assert_cmd = "2.0"
predicates = "3.1"
serde_json = "1.0"
tempfile = "3.10"
