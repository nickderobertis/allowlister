# Pinned toolchain for reproducible local and CI builds.
# The channel is an exact stable release so that `cargo +<channel>` resolves
# identically everywhere; bump deliberately alongside a `just upgrade`.
[toolchain]
channel = "1.96.0"
components = ["rustfmt", "clippy", "llvm-tools"]
targets = [
    # Linux host (dev + the local gate); release ships the musl triples below.
    "x86_64-unknown-linux-gnu",
    # Release targets: static, non-PIE musl on Linux (see .cargo/config.toml).
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
]
profile = "minimal"
